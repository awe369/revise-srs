name: Daily revision reminder

# Every morning: sends a message listing the notes due today, with links that open each one.
#   Telegram  → secrets TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID
#   WhatsApp  → secrets WHATSAPP_PHONE + WHATSAPP_APIKEY (free CallMeBot service)
# Set up either or both (see README). With neither, it opens a GitHub issue so GitHub notifies you instead.
on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 07:00 IST (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          TIMEZONE: Asia/Kolkata
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          WA_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WA_KEY: ${{ secrets.WHATSAPP_APIKEY }}
          APP_URL: ${{ vars.APP_URL }}
        with:
          script: |
            const fs = require('fs');
            let db;
            try { db = JSON.parse(fs.readFileSync('data/srs.json', 'utf8')); }
            catch (e) { core.info('No database yet — nothing to do.'); return; }

            const tz = process.env.TIMEZONE;
            const today = new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(new Date());
            const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
            const pretty = s => new Date(s + 'T00:00:00Z').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });
            const items = Object.values(db.items || {}).filter(it => !it.done && it.due);
            const due = items.filter(it => it.due <= today).sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
            const limit = +(db.settings && db.settings.dailyLimit) || 0;
            const shown = limit ? due.slice(0, limit) : due;
            const tomorrow = items.filter(it => it.due === addDays(today, 1)).length;

            const { owner, repo } = context.repo;
            const app = (process.env.APP_URL || `https://${owner}.github.io/${repo}/`).replace(/\/?$/, '/');
            const where = it => it.folder ? it.folder.split('/').join(' › ') : 'Home';
            const late = it => Math.round((Date.parse(today) - Date.parse(it.due)) / 864e5);

            const failures = [];
            let channels = 0;

            if (process.env.TG_TOKEN) {
              channels++;
              if (!process.env.TG_CHAT) failures.push('Telegram: TELEGRAM_CHAT_ID secret is missing');
              else {
                const h = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                let text;
                if (shown.length) {
                  const lines = shown.slice(0, 40).map((it, i) => `${i + 1}. <a href="${h(app + '#open=' + it.id)}">${h(it.name)}</a> — <i>${h(where(it))}</i>${late(it) > 0 ? ` · ${late(it)}d late` : ''}`);
                  text = `📚 <b>Aaj ${shown.length} revision due</b> · ${pretty(today)}\n\n${lines.join('\n')}`
                    + (shown.length > 40 ? `\n…and ${shown.length - 40} more` : '')
                    + (due.length > shown.length ? `\n\n(${due.length - shown.length} more beyond your daily limit)` : '')
                    + `\n\n👉 <a href="${h(app)}">Open Revise</a>`;
                } else {
                  text = `✅ <b>Aaj kuch due nahi</b> · ${pretty(today)}\nKal: ${tomorrow} file${tomorrow === 1 ? '' : 's'}.`;
                }
                try {
                  const r = await fetch(`https://api.telegram.org/bot${process.env.TG_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: process.env.TG_CHAT, text, parse_mode: 'HTML', disable_web_page_preview: true })
                  });
                  const j = await r.json();
                  if (!j.ok) failures.push(`Telegram: ${j.description} — check the bot token, the chat ID, and that you pressed Start in the bot chat`);
                  else core.info(`Telegram reminder sent (${shown.length} due).`);
                } catch (e) { failures.push('Telegram: ' + e.message); }
              }
            }

            if (process.env.WA_PHONE || process.env.WA_KEY) {
              channels++;
              if (!process.env.WA_PHONE || !process.env.WA_KEY) failures.push('WhatsApp: set both WHATSAPP_PHONE and WHATSAPP_APIKEY secrets');
              else {
                // WhatsApp shows links as plain URLs, so each file gets its own link line
                let text;
                if (shown.length) {
                  const max = 25;
                  const lines = shown.slice(0, max).map((it, i) => `${i + 1}. *${it.name}* — _${where(it)}_${late(it) > 0 ? ` · ${late(it)}d late` : ''}\n${app}#open=${it.id}`);
                  text = `📚 *Aaj ${shown.length} revision due* · ${pretty(today)}\n\n${lines.join('\n\n')}`
                    + (shown.length > max ? `\n\n…and ${shown.length - max} more in the app` : '')
                    + (due.length > shown.length ? `\n\n(${due.length - shown.length} more beyond your daily limit)` : '')
                    + `\n\n👉 Open Revise: ${app}`;
                } else {
                  text = `✅ *Aaj kuch due nahi* · ${pretty(today)}\nKal: ${tomorrow} file${tomorrow === 1 ? '' : 's'}.`;
                }
                const phone = process.env.WA_PHONE.replace(/[^\d+]/g, '');
                const url = `https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(phone)}&apikey=${encodeURIComponent(process.env.WA_KEY)}&text=${encodeURIComponent(text)}`;
                try {
                  const r = await fetch(url);
                  const body = (await r.text()).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
                  if (!r.ok || /error|invalid|not (allowed|registered)/i.test(body)) failures.push(`WhatsApp (CallMeBot): ${body.slice(0, 200) || 'HTTP ' + r.status}`);
                  else core.info(`WhatsApp reminder sent (${shown.length} due).`);
                } catch (e) { failures.push('WhatsApp (CallMeBot): ' + e.message); }
              }
            }

            if (channels) {
              if (failures.length) core.setFailed(failures.join('\n'));
              return;
            }

            // Fallback: a GitHub issue (GitHub notifies you by email / mobile app)
            const label = 'revision-reminder';
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: label });
            for (const i of open) await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            if (!shown.length) { core.info('Nothing due today.'); return; }
            try { await github.rest.issues.createLabel({ owner, repo, name: label, color: '2f6fde' }); } catch (e) {}
            const clean = s => String(s).replace(/[\[\]]/g, '');
            const lines = shown.map(it => `- [ ] [${clean(it.name)}](${app}#open=${it.id}) — ${clean(where(it))}${late(it) > 0 ? ` · ${late(it)}d late` : ''}`);
            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: `📚 ${shown.length} revision${shown.length > 1 ? 's' : ''} due — ${today}`,
              body: `@${owner} aaj ye revise karna hai:\n\n${lines.join('\n')}\n\n👉 [Open Revise](${app})`
            });
