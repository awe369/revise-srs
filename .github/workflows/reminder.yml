name: Daily revision reminder

# Every morning, opens an issue listing the notes due for revision.
# GitHub then notifies you (email / GitHub mobile app). Yesterday's issue is closed automatically.
on:
  schedule:
    - cron: '15 2 * * *'   # 02:15 UTC = 07:45 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          TIMEZONE: Asia/Kolkata
        with:
          script: |
            const fs = require('fs');
            let db;
            try { db = JSON.parse(fs.readFileSync('data/srs.json', 'utf8')); }
            catch (e) { core.info('No database yet — nothing to do.'); return; }

            const today = new Intl.DateTimeFormat('en-CA', { timeZone: process.env.TIMEZONE }).format(new Date());
            const due = Object.values(db.items || {})
              .filter(it => !it.done && it.due && it.due <= today)
              .sort((a, b) => a.due.localeCompare(b.due) || a.name.localeCompare(b.name));

            const { owner, repo } = context.repo;
            const label = 'revision-reminder';
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: label });
            for (const i of open) {
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }
            if (!due.length) { core.info('Nothing due today.'); return; }

            try { await github.rest.issues.createLabel({ owner, repo, name: label, color: '2f6fde' }); } catch (e) {}
            const app = `https://${owner}.github.io/${repo}/`;
            const clean = s => String(s).replace(/[\[\]]/g, '');
            const lines = due.map(it => {
              const late = Math.round((Date.parse(today) - Date.parse(it.due)) / 864e5);
              const where = it.folder ? it.folder.split('/').join(' › ') : 'Home';
              return `- [ ] [${clean(it.name)}](${app}#open=${it.id}) — ${clean(where)}${late > 0 ? ` · ${late}d late` : ''}`;
            });
            await github.rest.issues.create({
              owner, repo, labels: [label],
              title: `📚 ${due.length} revision${due.length > 1 ? 's' : ''} due — ${today}`,
              body: `@${owner} aaj ye revise karna hai:\n\n${lines.join('\n')}\n\n👉 [Open Revise](${app})`
            });
