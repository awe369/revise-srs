<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClozeForge</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 320px; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  header b { font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stat span { font-size: 11.5px; color: var(--muted); }
  .stat.hot b { color: var(--accent); }
  .btns { display: grid; gap: 8px; }
  .foot { margin-top: 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .foot button { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; }
  .warn { font-size: 12.5px; color: var(--bad); margin-bottom: 12px; }
  .gbtn { width: 100%; margin-bottom: 14px; }
  .filenote { font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .filenote .btn { width: 100%; margin-top: 8px; padding: 6px 10px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
</style>
</head>
<body>
  <header>
    <b><span class="logo">[…]</span> ClozeForge</b>
    <a href="options.html" target="_blank" title="Settings">Settings</a>
  </header>
  <div class="warn" id="warn" hidden></div>
  <div class="filenote" id="fileNote" hidden>
    <b>PDFs on this computer need one setting.</b> Turn on <i>Allow access to file URLs</i>, then reload the PDF.
    <button class="btn" id="fileFix">Open the setting</button>
  </div>
  <button class="btn primary gbtn" id="google" hidden><span class="g">G</span> Sign in with Google</button>
  <div class="stats">
    <div class="stat hot"><b id="due">–</b><span>due now</span></div>
    <div class="stat"><b id="new">–</b><span>new</span></div>
    <div class="stat"><b id="total">–</b><span>cards</span></div>
  </div>
  <div class="btns">
    <button class="btn primary" id="review">Start review ↗</button>
    <button class="btn" id="make" title="Shortcut: Alt+Shift+C">Card from selection <kbd>Alt+Shift+C</kbd></button>
    <button class="btn" id="openPdf" title="Pick a PDF from this computer and open it in the ClozeForge viewer">Open a PDF…</button>
  </div>
  <div class="foot" style="margin-bottom:-6px"><span id="anki" hidden></span></div>
  <div class="foot"><span><span id="where"></span> · <span id="sync">–</span></span><button id="syncNow">Sync now</button></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
